<button onclick="buscarUsuarios()">
    buscar usuários
</button>

<script>
    async function buscarUsuarios() {
        const resposta = await fetch(
            "https://jasonplaneholder.typicode.co/users"
        );
        const usuarios = await resposta.json();
        
        let html="";
        usuarios.forEach(usuario=> {
            html +=
            <p>
                ${usuario.name}
                </p>
                ;
        });
        document.gtElementById(
            "resultado"
        ).innerHTML = html;
    }
</script>
